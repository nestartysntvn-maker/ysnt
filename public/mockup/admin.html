<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Mockup quản trị · Yến Sào Nha Trang</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16282C;--ink2:#51656A;--sea:#0E5E66;--sea50:#E7F0F0;--red:#C4161C;--red50:#FBECEC;--amb:#8A5A00;--amb50:#FFF4DC;--line:#D8E2E1;--bg:#F3F6F6}
*{box-sizing:border-box}html,body{margin:0}body{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button,input,select{font:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav.side{background:var(--ink);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh}
.side .logo{font-weight:700;font-size:16px;padding:0 10px 16px;line-height:1.2}.side .logo small{display:block;font-weight:400;opacity:.7;font-size:12px}
.side a{display:flex;justify-content:space-between;align-items:center;color:#fff;text-decoration:none;padding:10px;border-radius:10px;opacity:.82}
.side a[aria-current=page]{background:rgba(255,255,255,.12);opacity:1;font-weight:600}
.cnt{background:var(--red);border-radius:9px;font-size:11px;padding:1px 7px;font-weight:600}
main{padding:24px 28px 48px;min-width:0}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}.lead{color:var(--ink2);margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.kpi span{color:var(--ink2);font-size:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 10px}
.todo{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.todo:first-of-type{border-top:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}.tools input{flex:1;min-width:200px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--sea);color:#fff;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.ghost{background:#fff;color:var(--sea);border:1.5px solid var(--sea)}.btn.red{background:var(--red)}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th{text-align:left;font-size:12px;color:var(--ink2);font-weight:600;background:#FAFCFC;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#FAFCFC}
.num,.tbl th.num{text-align:right;white-space:nowrap}.th{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--sea50);display:block}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--sea50);color:var(--sea)}.warn{background:var(--amb50);color:var(--amb)}.bad{background:var(--red50);color:var(--red)}
.wrap{overflow-x:auto;border-radius:14px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:#fff;box-shadow:-12px 0 32px rgba(22,40,44,.18);z-index:10;overflow:auto;padding:22px}
.shade{position:fixed;inset:0;background:rgba(22,40,44,.35);z-index:9}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.f{display:grid;gap:4px}.f label{font-size:12px;font-weight:600;color:var(--ink2)}.f input,.f select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.vt input{border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%}.vt td{padding:6px 8px}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.mock{position:fixed;right:12px;bottom:12px;background:var(--ink);color:#fff;border-radius:10px;font-size:12px;padding:7px 10px;opacity:.9;z-index:20}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav.side{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px}.side .logo{display:none}.side a{white-space:nowrap}main{padding:16px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:1fr}}
</style></head><body>

<script>

      <td><input value="${esc(v.sku)}" aria-label="SKU">${v.gen ? `<div style="margin-top:4px"><span class="pill warn">Mã tạm</span>${v.old ? ` <span style="font-size:12px;color:var(--ink2)">mã cũ trùng: ${esc(v.old)}</span>` : ''}</div>` : ''}</td>
      <td><input value="${v.p.toLocaleString('vi-VN')}" style="text-align:right" inputmode="numeric" aria-label="Giá"></td>

  </aside>`;
}
function issues() {
  const kind = t => t.startsWith('Không có SKU') ? 'Mã tự tạo' : t.startsWith('SKU trùng') || t.startsWith('Mã mới') ? 'SKU trùng' : 'Ghi chú dữ liệu';
  const kinds = ['Mã tự tạo', 'SKU trùng', 'Ghi chú dữ liệu'];
  const L = ISS.filter(x => !issueKind || kind(x.t) === issueKind);
  return `<h1>Dữ liệu cần kiểm tra</h1><p class="lead">Ghi lại những gì đã sửa khi chuyển dữ liệu từ ysnt.vn. Kho và kế toán rà lại, sửa xong thì đánh dấu đã xong.</p>
  <div class="tools"><select onchange="issueKind=this.value;render()" aria-label="Lọc loại"><option value="">Tất cả (${ISS.length})</option>${kinds.map(k => `<option value="${k}" ${k === issueKind ? 'selected' : ''}>${k} (${ISS.filter(x => kind(x.t) === k).length})</option>`).join('')}</select></div>
  <div class="wrap"><table class="tbl"><thead><tr><th>Loại</th><th>Sản phẩm</th><th>Quy cách</th><th>SKU</th><th>Việc cần làm</th><th></th></tr></thead><tbody>
  ${L.map(x => { const k = kind(x.t); return `<tr><td><span class="pill ${k === 'SKU trùng' ? 'bad' : k === 'Mã tự tạo' ? 'warn' : 'ok'}">${k}</span></td><td>${esc(x.p)}</td><td>${esc(x.v)}</td><td style="white-space:nowrap">${esc(x.sku)}</td><td>${esc(x.t)}</td><td><button class="btn ghost" onclick="this.textContent='Đã xong';this.disabled=true">Đánh dấu xong</button></td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function genCode(name, type) {
  const pre = { guide: 'HDV', guide_regular: 'LH', staff: 'NV', koc: 'KOC', agent: 'DL' }[type] || 'DS';
  const base = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'D').toUpperCase().split(/\s+/).filter(Boolean).pop() || 'X';
  return pre + base.slice(0, 6) + String(ambs.length + 1).padStart(2, '0');
}

function addAmb(f) {
  const n = f.n.value.trim(), ph = f.ph.value.replace(/[\s.]/g, ''), t = f.t.value;

    group: ['nhom', 'loai khach', 'phan loai'],
    source: ['nguon', 'kenh'],
    note: ['ghi chu', 'note', 'notes']
  };
  const GROUPS = ['Khách lẻ', 'Khách doanh nghiệp', 'Đại lý', 'Khách quốc tế'];
  const SOURCES = ['Showroom', 'Web', 'TikTok Shop', 'Shopee', 'Hướng dẫn viên', 'Đại lý', 'Sự kiện, hội chợ', 'Danh sách cũ'];
  // Đầu số di động cũ 11 số đổi sang 10 số (năm 2018)
  const OLD = { '0162': '032', '0163': '033', '0164': '034', '0165': '035', '0166': '036', '0167': '037', '0168': '038', '0169': '039', '0120': '070', '0121': '079', '0122': '077', '0126': '076', '0128': '078', '0123': '083', '0124': '084', '0125': '085', '0127': '081', '0129': '082', '0186': '056', '0188': '058', '0199': '059' };
  const XLSX_URL = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const fold = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const fmtTime = d => d.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
  const csvCell = v => /[",;\r\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const colName = i => (i >= 26 ? colName(Math.floor(i / 26) - 1) : '') + String.fromCharCode(65 + i % 26);
  const n0 = n => n.toLocaleString('vi-VN');

  // Số điện thoại Việt Nam: bỏ khoảng trắng, dấu chấm; +84 thành 0; thêm lại số 0 Excel làm mất; đổi đầu số cũ 11 số
  function normPhone(raw) {
    const orig = String(raw ?? '').trim();
    if (!orig) return { v: '', err: 'Thiếu số điện thoại' };
    const parts = orig.split(/\s*[\/,;|]\s*|\s+-\s+|\s+(?:hoặc|hoac|or)\s+/i).filter(Boolean);
    let s = parts[0] || '';
    const fix = [];
    if (/^\d+(\.\d+)?e\+?\d+$/i.test(s)) s = String(Math.round(Number(s)));
    const m = s.match(/\+?\d[\d\s.\-()]{6,}\d/);
    if (m) s = m[0];
    s = s.replace(/[^\d+]/g, '').replace(/(?!^)\+/g, '');
    if (!s.replace(/\D/g, '')) return { v: orig, err: 'Thiếu số điện thoại' };
    if (/^\+?84\d{9,11}$/.test(s)) { s = '0' + s.replace(/^\+?84/, '').replace(/^0/, ''); fix.push('đổi +84 thành 0'); }
    else if (/^(?:[35789]\d{8}|[12]\d{9})$/.test(s)) { s = '0' + s; fix.push('thêm số 0 Excel làm mất'); }
    if (/^01\d{9}$/.test(s) && OLD[s.slice(0, 4)]) { const o = s.slice(0, 4); s = OLD[o] + s.slice(4); fix.push(`đổi đầu số cũ ${o} thành ${OLD[o]}`); }
    if (!/^(?:0[35789]\d{8}|02\d{9})$/.test(s)) return { v: orig, err: 'Số điện thoại sai: di động 10 số, máy bàn 11 số' };
    const extra = parts.slice(1).filter(p => p.replace(/\D/g, '').length >= 8);
    if (extra.length) fix.push('số thứ hai đưa vào ghi chú');
    return { v: s, fix: fix.join(', '), extra };
  }

  function check() {
    const seen = new Map(), byPhone = new Map(custs.map(c => [c.phone, c])), m = imp.map;
    return imp.rows.map((r, i) => {
      const get = f => m[f] >= 0 ? String(r[m[f]] ?? '').trim() : '';
      const ph = normPhone(get('phone'));
      const o = { line: imp.lines[i], raw: r, name: get('name').replace(/\s+/g, ' '), phone: ph.v, fix: ph.fix || '', email: get('email').toLowerCase(), addr: get('addr'), dob: get('dob'), group: get('group'), source: get('source'), note: get('note') };
      if (ph.extra && ph.extra.length) o.note = [o.note, 'SĐT khác: ' + ph.extra.join(', ')].filter(Boolean).join(' · ');
      if (o.email && !EMAIL.test(o.email)) { o.email = ''; o.fix = [o.fix, 'email sai nên để trống'].filter(Boolean).join(', '); }
      if (o.name.length < 2) { o.st = 'err'; o.why = 'Thiếu họ tên'; }
      else if (ph.err) { o.st = 'err'; o.why = ph.err; }
      else if (seen.has(ph.v)) { o.st = 'dupf'; o.why = 'Trùng số với dòng ' + seen.get(ph.v) + ' trong file'; }
      else if (byPhone.has(ph.v)) { o.st = 'dupc'; o.old = byPhone.get(ph.v); o.why = 'Đã có: ' + o.old.name; }
      else o.st = 'new';
      if (o.st !== 'err' && !seen.has(ph.v)) seen.set(ph.v, o.line);
      return o;
    });
  }
  const canFill = o => o.st === 'dupc' && ['email', 'addr', 'dob', 'note'].some(f => o[f] && !o.old[f]);

  function autoMap(headers) {
    const H = headers.map(fold), used = new Set(), m = {};
    for (const [f] of FIELDS) { const i = H.findIndex((h, k) => !used.has(k) && SYN[f].includes(h)); m[f] = i; if (i >= 0) used.add(i); }
    for (const [f] of FIELDS) if (m[f] < 0) {
      const i = H.findIndex((h, k) => !used.has(k) && h && CON[f].some(s => (' ' + h + ' ').includes(' ' + s + ' ')));
      m[f] = i; if (i >= 0) used.add(i);
    }
    return m;
  }

  // Không nhận ra tên cột thì đoán theo dữ liệu: cột nào phần lớn là số điện thoại, cột nào phần lớn là tên người
  function guess(m, rows, w) {
    const used = new Set(Object.values(m).filter(i => i >= 0)), sample = rows.slice(0, 200);
    const share = (i, ok) => { const v = sample.map(r => r[i] || '').filter(Boolean); return v.length ? v.filter(ok).length / v.length : 0; };
    const pick = (f, ok) => {
      if (m[f] >= 0) return;
      let best = -1, bs = .6;
      for (let i = 0; i < w; i++) if (!used.has(i)) { const s = share(i, ok); if (s > bs) { bs = s; best = i; } }
      m[f] = best; if (best >= 0) used.add(best);
    };
    pick('phone', c => !normPhone(c).err);
    pick('email', c => EMAIL.test(c));
    if (!(m.name >= 0)) { m.name = -1; for (let i = 0; i < w; i++) if (!used.has(i) && share(i, c => /\p{L}{2}/u.test(c) && !/[\d@]/.test(c) && c.length <= 60) > .6) { m.name = i; used.add(i); break; } }
  }

  function parseDelim(text, d) {
    text = text.replace(/^\uFEFF/, '');
    if (!d) { const first = text.split(/\r?\n/)[0] || ''; d = ['\t', ';', ','].map(x => [x, first.split(x).length]).sort((a, b) => b[1] - a[1])[0][0]; }
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"' && cell === '') q = true;
      else if (ch === d) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  // CSV có thể là UTF-8, UTF-16 (Excel “Unicode Text”) hoặc mã Windows tiếng Việt cũ
  function decode(buf) {
    const b = new Uint8Array(buf);
    if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
    if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
    const t = new TextDecoder('utf-8').decode(buf);
    return t.includes('\uFFFD') ? new TextDecoder('windows-1258').decode(buf) : t;
  }

  function loadXLSX() {
    if (window.XLSX) return Promise.resolve();
    return new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = XLSX_URL;
      s.onload = () => window.XLSX ? ok() : fail();
      s.onerror = fail;
      function fail() { s.remove(); const e = new Error('Không tải được bộ đọc file Excel (cần có mạng). Có thể lưu file thành CSV rồi chọn lại, hoặc chép các ô trong Excel rồi dán vào ô bên dưới.'); e.kh = 1; no(e); }
      document.head.appendChild(s);
    });
  }

  function load(rows, fileName, sheet) {
    const all = rows.map((r, i) => ({ r: (r || []).map(c => String(c ?? '').normalize('NFC').trim()), n: i + 1 })).filter(x => x.r.some(Boolean));
    imp.busy = false;
    if (!all.length) { imp.err = 'Không thấy dữ liệu trong file.'; render(); return; }
    let h = all.slice(0, 10).findIndex(x => { const m = autoMap(x.r); return m.name >= 0 && m.phone >= 0; }), noHead = false;
    if (h < 0) { noHead = all[0].r.some(c => !normPhone(c).err); h = noHead ? -1 : 0; }
    const data = all.slice(h + 1);
    if (!data.length) { imp.err = 'Chỉ thấy dòng tiêu đề, chưa có dòng khách nào bên dưới.'; render(); return; }
    const w = all.reduce((a, x) => Math.max(a, x.r.length), 0);
    imp.headers = Array.from({ length: w }, (_, i) => (h >= 0 && all[h].r[i]) || 'Cột ' + colName(i));
    imp.rows = data.map(x => x.r); imp.lines = data.map(x => x.n);
    imp.map = noHead ? Object.fromEntries(FIELDS.map(([f]) => [f, -1])) : autoMap(imp.headers);
    guess(imp.map, imp.rows, w);
    imp.fileName = fileName; imp.sheet = sheet || ''; imp.headRow = h >= 0 ? all[h].n : 0;
    imp.err = ''; imp.view = 'all'; imp.step = 2; render();
  }

  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  async function saveSheet(name, aoa, widths) {
    try {
      await loadXLSX();
      const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = widths.map(wch => ({ wch }));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Khách hàng');
      XLSX.writeFile(wb, name + '.xlsx');
    } catch (e) { download(name + '.csv', aoa.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n'); }
  }

  const api = {
    open() { one = null; imp = { step: 1, err: '', busy: false, pasted: '', fileName: '', sheet: '', headers: [], rows: [], lines: [], map: {}, dup: 'skip', src: '__file', grp: 'Khách lẻ', view: 'all', result: null }; render(); },
    add() { imp = null; one = {}; render(); const el = document.getElementById('kn'); if (el) el.focus(); },
    close() { imp = null; one = null; render(); },
    isOpen: () => !!(imp || one),
    reset() { imp = null; one = null; },
    key: () => imp ? `i${imp.step}|${imp.view}` : one ? 'o|' : '',
    async file(f) {
      if (!f || !imp) return;
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      imp.err = '';
      try {
        if (ext === 'csv' || ext === 'txt') load(parseDelim(decode(await f.arrayBuffer())), f.name);
        else if (ext === 'xlsx' || ext === 'xls') {
          imp.busy = true; render();
          await loadXLSX();
          const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', dateNF: 'dd/mm/yyyy' });
          const sheets = wb.SheetNames.map(n => [n, XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' })]);
          const pick = sheets.find(([, rows]) => rows.slice(0, 12).some(r => { const m = autoMap(r); return m.name >= 0 && m.phone >= 0; })) || sheets.find(([, rows]) => rows.length) || sheets[0];
          load(pick ? pick[1] : [], f.name, sheets.length > 1 && pick ? pick[0] : '');
        } else { imp.err = 'Chỉ nhận file .xlsx, .xls hoặc .csv.'; render(); }
      } catch (e) {
        if (!imp) return;
        imp.busy = false;
        imp.err = e.kh ? e.message : /password|encrypt/i.test(e.message || '') ? 'File đang đặt mật khẩu. Mở file, bỏ mật khẩu rồi chọn lại.' : 'Không đọc được file này. Mở bằng Excel, lưu lại dạng .xlsx rồi chọn lại.';
        render();
      }
    },
    paste() {
      const t = (document.getElementById('khp') || {}).value || '';
      imp.pasted = t;
      if (!t.trim()) { imp.err = 'Chưa có dữ liệu trong ô dán.'; render(); return; }
      load(parseDelim(t, t.includes('\t') ? '\t' : ''), 'Dữ liệu dán');
    },
    loadRows: (rows, name, sheet) => load(rows, name, sheet),
    setMap(f, v) { imp.map[f] = +v; render(); },
    opt(k, v) { imp[k] = v; render(); },
    view(v) { imp.view = v; render(); },
    step(n) { imp.step = n; imp.err = ''; render(); },
    tpl() { saveSheet('mau-nhap-khach-hang', [FIELDS.map(f => f[1])], [26, 16, 28, 40, 12, 18, 16, 30]); },
    errs() {
      const L = check().filter(o => o.st === 'err');
      saveSheet('dong-loi-khach-hang', [['Dòng', ...imp.headers, 'Lý do'], ...L.map(o => [String(o.line), ...imp.headers.map((_, i) => o.raw[i] ?? ''), o.why])], [6, ...imp.headers.map(() => 18), 44]);
    },
    commit() {
      const L = check(), b = { id: batches.length + 1, file: imp.fileName, at: new Date(), added: [], filled: [], skipped: 0, errors: 0 };
      for (const o of L) {
        if (o.st === 'err') { b.errors++; continue; }
        if (o.st === 'dupf') { b.skipped++; continue; }
        if (o.st === 'dupc') {
          if (imp.dup === 'fill' && canFill(o)) {
            const before = { ...o.old };
            for (const f of ['email', 'addr', 'dob', 'note']) if (o[f] && !o.old[f]) o.old[f] = o[f];
            b.filled.push({ id: o.old.id, before });
          } else b.skipped++;
          continue;
        }
        const c = { id: ++seq, name: o.name, phone: o.phone, email: o.email, addr: o.addr, dob: o.dob, group: o.group || imp.grp, source: imp.src === '__file' ? (o.source || 'Danh sách cũ') : imp.src, note: o.note, batch: b.id };
        custs.push(c); b.added.push(c.id);
      }
      batches.unshift(b); imp.result = b; imp.step = 4; render();
    },
    undo(id) {
      const b = batches.find(x => x.id === id); if (!b || b.undone) return;
      custs = custs.filter(c => !b.added.includes(c.id));
      for (const f of b.filled) { const c = custs.find(x => x.id === f.id); if (c) Object.assign(c, f.before); }
      b.undone = true; render(); toast('Đã hoàn tác lô ' + id);
    },
    save(f) {
      const err = (msg, el) => { document.getElementById('kherr').textContent = msg; el.focus(); };
      const name = f.n.value.trim().replace(/\s+/g, ' '), ph = normPhone(f.ph.value), email = f.em.value.trim().toLowerCase();
      if (name.length < 2) return err('Nhập họ tên khách.', f.n);
      if (ph.err) return err(ph.err + '.', f.ph);
      const old = custs.find(c => c.phone === ph.v);
      if (old) return err('Số này đã có trong danh sách: ' + old.name + '.', f.ph);
      if (email && !EMAIL.test(email)) return err('Email chưa đúng.', f.em);
      custs.unshift({ id: ++seq, name, phone: ph.v, email, addr: f.ad.value.trim(), dob: f.db.value.trim(), group: f.g.value, source: f.s.value, note: f.no.value.trim(), batch: 0 });
      one = null; render(); toast('Đã thêm ' + name);
    },
    q(v) { cq = v; render(true); },
    g(v) { cg = v; render(); },
    count: () => custs.length,

    page() {
      const groups = [...new Set(custs.map(c => c.group).filter(Boolean))];
      let L = custs;
      if (cg) L = L.filter(c => c.group === cg);
      if (cq) { const s = fold(cq), d = cq.replace(/\D/g, ''); L = L.filter(c => fold([c.name, c.phone, c.email, c.addr].join(' ')).includes(s) || (d.length >= 3 && c.phone.includes(d))); }
      const live = batches.filter(b => !b.undone);
      return `<h1>Khách hàng</h1><p class="lead">Khách lẻ, khách doanh nghiệp và đại lý nằm chung một danh sách. Nhập danh sách cũ từ file Excel: hệ thống tự sửa số điện thoại, báo trùng và báo lỗi trước khi lưu.</p>
      ${custs.length ? `<div class="kpis">
        <div class="kpi"><b>${n0(custs.length)}</b><span>khách hàng</span></div>
        <div class="kpi"><b>${n0(custs.filter(c => /doanh nghiệp|đại lý/i.test(c.group)).length)}</b><span>doanh nghiệp, đại lý</span></div>
        <div class="kpi"><b>${n0(custs.filter(c => c.email).length)}</b><span>khách có email</span></div>
        <div class="kpi"><b>${live.length}</b><span>lô đã nhập</span></div></div>` : ''}
      <div class="tools"><input placeholder="Tìm theo tên, số điện thoại, email, địa chỉ" value="${esc(cq)}" oninput="KH.q(this.value)" aria-label="Tìm khách hàng">
        <select onchange="KH.g(this.value)" aria-label="Lọc nhóm khách"><option value="">Tất cả nhóm</option>${groups.map(g => `<option ${g === cg ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
        <button class="btn" onclick="KH.open()">Nhập danh sách</button><button class="btn ghost" onclick="KH.add()">Thêm một khách</button></div>
      ${custs.length ? `<div class="wrap"><table class="tbl kh-list"><thead><tr><th>Khách hàng</th><th>Nhóm</th><th>Nguồn</th><th>Email</th><th>Địa chỉ</th><th>Ghi chú</th><th class="num">Lô nhập</th></tr></thead><tbody>
        ${L.slice(0, 500).map(c => `<tr><td><b>${esc(c.name)}</b><span class="sub">${esc(c.phone)}</span>${c.dob ? `<span class="sub">Sinh ${esc(c.dob)}</span>` : ''}</td><td><span class="pill ok">${esc(c.group)}</span></td><td class="kh-nw">${esc(c.source)}</td><td>${esc(c.email)}</td><td><div class="kh-clip" title="${esc(c.addr)}">${esc(c.addr)}</div></td><td><div class="kh-clip" title="${esc(c.note)}">${esc(c.note)}</div></td><td class="num">${c.batch || 'Thêm tay'}</td></tr>`).join('')}
        </tbody></table></div>${L.length > 500 ? `<p class="kh-note">Đang hiện 500 trên ${n0(L.length)} khách. Tìm hoặc lọc để xem khách khác.</p>` : ''}${L.length ? '' : `<div class="empty"><b>Không có khách khớp “${esc(cq)}”</b>Thử tìm theo số điện thoại hoặc bỏ lọc nhóm.</div>`}`
      : `<div class="panel"><div class="empty"><b>Chưa có khách hàng nào</b>Bấm “Nhập danh sách” để đưa danh sách khách cũ từ file Excel hoặc CSV vào, hoặc “Thêm một khách” để nhập tay.</div></div>`}
      ${batches.length ? `<div class="panel" style="margin-top:16px"><h2>Các lô đã nhập</h2><div class="wrap"><table class="tbl"><thead><tr><th>Lô</th><th>File</th><th>Lúc nhập</th><th class="num">Thêm mới</th><th class="num">Bổ sung</th><th class="num">Bỏ qua</th><th class="num">Lỗi</th><th></th></tr></thead><tbody>
        ${batches.map(b => `<tr><td><b>${b.id}</b></td><td class="kh-nw">${esc(b.file)}</td><td class="kh-nw">${fmtTime(b.at)}</td><td class="num">${n0(b.added.length)}</td><td class="num">${b.filled.length}</td><td class="num">${b.skipped}</td><td class="num">${b.errors}</td><td>${b.undone ? '<span class="pill warn">Đã hoàn tác</span>' : `<button class="btn ghost" onclick="KH.undo(${b.id})">Hoàn tác</button>`}</td></tr>`).join('')}
        </tbody></table></div></div>` : ''}`;
    },

    drawer() {
      if (one) return `<div class="shade" onclick="KH.close()"></div><aside class="drawer kh-d" role="dialog" aria-modal="true" aria-label="Thêm khách hàng">
        <div class="kh-head"><h1>Thêm khách hàng</h1><button class="btn ghost" onclick="KH.close()">Đóng</button></div>
        <form class="form" onsubmit="event.preventDefault();KH.save(this)" novalidate>
          <div class="f"><label for="kn">Họ tên</label><input id="kn" name="n" autocomplete="off"></div>
          <div class="f"><label for="kp">Số điện thoại</label><input id="kp" name="ph" inputmode="tel" autocomplete="off"></div>
          <div class="f"><label for="ke">Email</label><input id="ke" name="em" type="email" autocomplete="off"></div>
          <div class="f"><label for="kg">Nhóm khách</label><select id="kg" name="g">${GROUPS.map(g => `<option>${g}</option>`).join('')}</select></div>
          <div class="f"><label for="ks">Nguồn</label><select id="ks" name="s">${SOURCES.map(s => `<option>${s}</option>`).join('')}</select></div>
          <div class="f"><label for="kd">Ngày sinh</label><input id="kd" name="db" placeholder="dd/mm/yyyy" autocomplete="off"></div>
          <div class="f" style="grid-column:1/-1"><label for="ka">Địa chỉ</label><input id="ka" name="ad" autocomplete="off"></div>
          <div class="f" style="grid-column:1/-1"><label for="ko">Ghi chú</label><input id="ko" name="no" autocomplete="off"></div>
          <div style="grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn">Thêm khách</button><span id="kherr" role="alert" style="color:var(--red);font-size:13px"></span></div>
        </form></aside>`;
      if (!imp) return '';
      const S = imp.step, steps = ['Chọn file', 'Ghép cột', 'Kiểm tra', 'Xong'];
      const head = `<div class="kh-head"><h1>Nhập danh sách khách hàng</h1><button class="btn ghost" onclick="KH.close()">Đóng</button></div>
        <ol class="kh-steps">${steps.map((t, i) => `<li ${i + 1 === S ? 'aria-current="step"' : i + 1 < S ? 'class="done"' : ''}>${t}</li>`).join('')}</ol>`;
      let body = '';
      if (S === 1) {
        body = `<label class="kh-drop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');KH.file(event.dataTransfer.files[0])">
            <b>Chọn file Excel hoặc CSV</b><span>Kéo thả file vào đây hoặc bấm để chọn file .xlsx, .xls, .csv</span>
            <input type="file" id="khf" accept=".xlsx,.xls,.csv" onchange="KH.file(this.files[0])"></label>
          ${imp.busy ? '<p class="kh-busy" role="status">Đang đọc file…</p>' : ''}${imp.err ? `<p class="kh-err" role="alert">${esc(imp.err)}</p>` : ''}
          <p class="kh-or">hoặc chép các ô trong Excel, Google Sheets (gồm cả dòng tiêu đề) rồi dán vào đây</p>
          <textarea id="khp" rows="5" placeholder="Dán danh sách vào đây" aria-label="Dán danh sách khách">${esc(imp.pasted)}</textarea>
          <div class="kh-actions"><button class="btn ghost" onclick="KH.tpl()">Tải file mẫu</button><span style="flex:1"></span><button class="btn" onclick="KH.paste()">Dùng dữ liệu đã dán</button></div>
          <div class="panel kh-tip"><h2>File cần có gì</h2><ul>
            <li>Bắt buộc có cột <b>Họ tên</b> và <b>Số điện thoại</b>. Tên cột viết kiểu nào cũng được (SĐT, Điện thoại, Tên khách…), hệ thống tự nhận. File có dòng tiêu đề lớn ở trên cùng cũng được.</li>
            <li>Nếu có thì thêm: Email, Địa chỉ, Ngày sinh, Nhóm khách, Nguồn, Ghi chú.</li>
            <li>Số điện thoại bị Excel làm mất số 0, ghi dạng +84, hoặc còn đầu số cũ 11 số (0168…, 0122…) đều được tự sửa.</li>
            <li>Khách trùng số điện thoại không bị nhập hai lần. Chưa có gì được lưu cho đến khi bấm Nhập ở bước 3.</li></ul></div>`;
      } else if (S === 2) {
        const ok = imp.map.name >= 0 && imp.map.phone >= 0, first = imp.rows[0] || [];
        const where = imp.headRow === 0 ? '. File không có dòng tiêu đề nên hệ thống đoán cột theo dữ liệu, xem lại trước khi đi tiếp.' : `${imp.headRow > 1 ? `, tiêu đề ở dòng ${imp.headRow}` : ''}. Hệ thống đã tự ghép theo tên cột, sửa lại nếu chưa đúng.`;
        body = `<p class="lead"><b>${esc(imp.fileName)}</b>${imp.sheet ? ` (trang tính “${esc(imp.sheet)}”)` : ''}: ${n0(imp.rows.length)} dòng khách, ${imp.headers.length} cột${where}</p>
          <div class="wrap"><table class="tbl kh-map"><thead><tr><th>Thông tin khách</th><th>Lấy từ cột trong file</th><th>Ví dụ ở dòng ${imp.lines[0]}</th></tr></thead><tbody>
          ${FIELDS.map(([f, t, req]) => `<tr><td><b>${t}</b>${req ? ' <span class="pill bad">bắt buộc</span>' : ''}</td>
            <td><select onchange="KH.setMap('${f}',this.value)" aria-label="Cột cho ${t}"><option value="-1">Không dùng</option>${imp.headers.map((h, i) => `<option value="${i}" ${imp.map[f] === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select></td>
            <td><div class="kh-ex">${imp.map[f] >= 0 ? esc(first[imp.map[f]] ?? '') : ''}</div></td></tr>`).join('')}
          </tbody></table></div>
          ${ok ? '' : '<p class="kh-err" role="alert">Chọn cột cho Họ tên và Số điện thoại để đi tiếp.</p>'}
          <div class="kh-actions kh-bar"><button class="btn ghost" onclick="KH.step(1)">Chọn file khác</button><span style="flex:1"></span><button class="btn" onclick="KH.step(3)" ${ok ? '' : 'disabled'}>Kiểm tra dữ liệu</button></div>`;
      } else if (S === 3) {
        const L = check(), n = st => L.filter(o => o.st === st).length;
        const nNew = n('new'), nDup = n('dupc') + n('dupf'), nErr = n('err'), nFix = L.filter(o => o.fix && o.st !== 'err').length, nFill = imp.dup === 'fill' ? L.filter(canFill).length : 0;
        const V = imp.view === 'all' ? L : imp.view === 'dup' ? L.filter(o => o.st === 'dupc' || o.st === 'dupf') : imp.view === 'fix' ? L.filter(o => o.fix && o.st !== 'err') : L.filter(o => o.st === imp.view);
        const chip = (v, t, c) => `<button class="kh-chip" id="khv-${v}" aria-pressed="${imp.view === v}" onclick="KH.view('${v}')">${t} <i>${n0(c)}</i></button>`;
        const res = o => o.st === 'new' ? '<span class="pill ok">Thêm mới</span>'
          : o.st === 'dupc' ? `<span class="pill warn">${imp.dup === 'fill' && canFill(o) ? 'Bổ sung ô trống' : 'Bỏ qua'}</span><span class="sub">${esc(o.why)}</span>`
          : o.st === 'dupf' ? `<span class="pill warn">Bỏ qua</span><span class="sub">${esc(o.why)}</span>`
          : `<span class="pill bad">Lỗi</span><span class="sub">${esc(o.why)}</span>`;
        const back = `<button class="btn ghost" onclick="KH.step(2)">Quay lại ghép cột</button>${nErr ? `<button class="btn ghost" onclick="KH.errs()">Tải ${n0(nErr)} dòng lỗi để sửa</button>` : ''}`;
        body = `<p class="lead">Chưa có gì được lưu. Xem kết quả kiểm tra, chọn cách xử lý rồi bấm Nhập.</p>
          <div class="kh-sum" role="group" aria-label="Lọc kết quả">${chip('all', 'Tất cả', L.length)}${chip('new', 'Thêm mới', nNew)}${chip('dup', 'Trùng số điện thoại', nDup)}${chip('err', 'Lỗi', nErr)}${nFix ? chip('fix', 'Đã tự sửa', nFix) : ''}</div>
          <div class="form kh-opts">
            <div class="f"><label for="khdup">Khách đã có trong danh sách</label><select id="khdup" onchange="KH.opt('dup',this.value)"><option value="skip" ${imp.dup === 'skip' ? 'selected' : ''}>Bỏ qua, giữ thông tin cũ</option><option value="fill" ${imp.dup === 'fill' ? 'selected' : ''}>Bổ sung các ô còn trống</option></select></div>
            <div class="f"><label for="khsrc">Nguồn khách cho cả lô</label><select id="khsrc" onchange="KH.opt('src',this.value)"><option value="__file" ${imp.src === '__file' ? 'selected' : ''}>${imp.map.source >= 0 ? 'Theo cột Nguồn trong file' : 'Danh sách cũ'}</option>${SOURCES.filter(s => imp.map.source >= 0 || s !== 'Danh sách cũ').map(s => `<option ${imp.src === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
            <div class="f"><label for="khgrp">Nhóm khách khi file để trống</label><select id="khgrp" onchange="KH.opt('grp',this.value)">${GROUPS.map(g => `<option ${imp.grp === g ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
          </div>
          <div class="kh-actions kh-m">${back}</div>
          <div class="kh-scroll"><table class="tbl"><thead><tr><th class="num">Dòng</th><th>Họ tên</th><th>Số điện thoại</th><th>Nhóm</th><th>Kết quả</th></tr></thead><tbody>
          ${V.slice(0, 300).map(o => `<tr><td class="num">${o.line}</td><td><b>${esc(o.name) || '<span class="sub">trống</span>'}</b>${o.email ? `<span class="sub">${esc(o.email)}</span>` : ''}</td><td style="white-space:nowrap">${esc(o.phone)}${o.fix ? `<span class="kh-fix">${esc(o.fix)}</span>` : ''}</td><td>${esc(o.group || imp.grp)}</td><td>${res(o)}</td></tr>`).join('')}
          </tbody></table></div>
          ${V.length > 300 ? `<p class="kh-note">Đang hiện 300 trên ${n0(V.length)} dòng.</p>` : ''}
          <div class="kh-actions kh-bar"><span class="kh-dk">${back}</span><span style="flex:1"></span>
            <button class="btn" onclick="KH.commit()" ${nNew + nFill ? '' : 'disabled'}>Nhập ${n0(nNew)} khách mới${nFill ? `, bổ sung ${n0(nFill)}` : ''}</button></div>`;
      } else {
        const b = imp.result;
        body = `<div class="kh-done"><h2>Đã nhập xong lô ${b.id}</h2>
          <p>Thêm <b>${n0(b.added.length)}</b> khách mới, bổ sung ${b.filled.length}, bỏ qua ${b.skipped} dòng trùng, ${b.errors} dòng lỗi không nhập.</p>
          <div class="kh-actions"><button class="btn ghost" onclick="KH.undo(${b.id});KH.close()">Hoàn tác lô này</button><button class="btn" onclick="KH.close()">Xem danh sách khách</button></div>
          <p class="kh-note">Mockup: chưa lưu vào database. Bản thật sẽ sao lưu trước khi ghi và giữ lịch sử từng lô để hoàn tác.</p></div>`;
      }
      return `<div class="shade" onclick="KH.close()"></div><aside class="drawer kh-wide kh-d" role="dialog" aria-modal="true" aria-label="Nhập danh sách khách hàng" ondragover="event.preventDefault()" ondrop="event.preventDefault()">${head}${body}</aside>`;
    }
  };
  return api;
})();

// Thêm mục Khách hàng vào menu, sau Đơn hàng
PAGES.splice(PAGES.findIndex(p => p[0] === 'orders') + 1, 0, ['customers', 'Khách hàng']);

// Tổng quan: thêm một việc cần làm về khách hàng
const overviewBase = overview;
overview = function () {
  const n = KH.count();
  const row = n ? `<div class="todo"><span><b>${n.toLocaleString('vi-VN')} khách hàng</b> trong danh sách, sẵn để chăm sóc và mời mua lại.</span><a class="btn ghost" href="#/customers">Xem khách hàng</a></div>`
    : `<div class="todo"><span><b>Chưa có khách hàng nào.</b> Nhập danh sách khách cũ từ file Excel để chăm sóc và mời mua lại.</span><a class="btn ghost" href="#/customers">Nhập danh sách</a></div>`;
  return overviewBase().replace('Thêm đại sứ</a></div></div>', 'Thêm đại sứ</a></div>' + row + '</div>');
};

// Trang Khách hàng: vẽ giống các trang khác, giữ chỗ cuộn và ô đang chọn khi vẽ lại
const renderBase = render;
let khLast = '';
render = function (keepFocus) {
  const k = location.hash.replace(/^#\/?/, '');
  if (k !== 'customers') { khLast = ''; return renderBase(keepFocus); }
  nav(k);
  const a = document.activeElement, sel = a && a !== document.body ? (a.id ? '#' + a.id : a.getAttribute('aria-label') ? `[aria-label="${a.getAttribute('aria-label')}"]` : '') : '', pos = a && a.selectionStart;
  const key = KH.key(), sameDrawer = key && key.split('|')[0] === khLast.split('|')[0], sameTable = key && key === khLast; khLast = key;
  const d = document.querySelector('.drawer'), ds = d ? d.scrollTop : 0, t = document.querySelector('.kh-scroll'), ts = t ? t.scrollTop : 0;
  $('#main').innerHTML = KH.page() + KH.drawer();
  if (sameDrawer) { const d2 = document.querySelector('.drawer'); if (d2) d2.scrollTop = ds; }
  if (sameTable) { const t2 = document.querySelector('.kh-scroll'); if (t2) t2.scrollTop = ts; }
  if (sel && (keepFocus || sameDrawer)) { const el = document.querySelector(sel); if (el) { el.focus({ preventScroll: true }); if (keepFocus) try { el.setSelectionRange(pos, pos); } catch {} } }
};
addEventListener('hashchange', () => { if (location.hash !== '#/customers') KH.reset(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && KH.isOpen()) KH.close(); });
render();
</script>
</body></html>
