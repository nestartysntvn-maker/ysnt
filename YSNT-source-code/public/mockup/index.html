<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mockup trang mua hàng · Yến Sào Nha Trang</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16282C;--ink2:#51656A;--sea:#0E5E66;--sea50:#E7F0F0;--red:#C4161C;--red50:#FBECEC;--line:#D8E2E1;--paper:#fff;--gold:#9C7A1E;--bg:#F3F6F6}
*{box-sizing:border-box}html,body{margin:0}
html,body{overflow-x:hidden}body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:88px}
a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.15;text-decoration:none;flex:1}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;height:40px;min-width:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:600}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:12px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.ref{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:var(--sea50);color:var(--sea);font-size:13px}
.search{margin:12px 16px 0;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.search input{flex:1;border:0;padding:12px;font:inherit;min-width:0}
.hero{margin:14px 16px 0;border-radius:18px;background:var(--sea);color:#fff;padding:20px 18px;display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;align-items:center}
.hero h1{font-size:26px;line-height:1.12;margin:0 0 8px;letter-spacing:-.02em;font-weight:700}
.hero p{margin:0 0 14px;font-size:14px;opacity:.88}
.hero img{width:104px;height:104px;object-fit:cover;border-radius:14px;background:#fff}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-red{background:var(--red);color:#fff}.btn-line{background:var(--paper);border:1.5px solid var(--sea);color:var(--sea)}.btn-white{background:#fff;color:var(--sea)}
.sec{padding:22px 16px 0}.sec h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}.sec .sub{margin:0 0 12px;color:var(--ink2);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{text-decoration:none;display:block}
.card .ph{aspect-ratio:1;border-radius:14px;background:var(--sea50);overflow:hidden;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .nm{font-size:14px;font-weight:500;margin:8px 0 2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{font-weight:700;color:var(--red)}.card .vc{font-size:12px;color:var(--ink2)}
.tag{position:absolute;left:8px;top:8px;background:#fff;color:var(--gold);font-size:11px;font-weight:600;border-radius:8px;padding:3px 7px}
.out{position:absolute;inset:auto 8px 8px 8px;background:rgba(22,40,44,.82);color:#fff;font-size:12px;text-align:center;border-radius:8px;padding:4px}
</style>
<style>
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tier{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:10px 8px;text-align:left}
.tier b{display:block;font-size:14px}.tier span{font-size:12px;color:var(--ink2)}
.tier[aria-pressed=true]{border-color:var(--sea);background:var(--sea50);box-shadow:inset 0 0 0 1px var(--sea)}
.visit{margin:22px 16px 0;border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px}
.visit h3{margin:0;font-size:16px}.visit p{margin:0;color:var(--ink2);font-size:14px}
.pd-img{aspect-ratio:1;background:var(--sea50)}.pd-img img{width:100%;height:100%;object-fit:cover;display:block}
.pd{padding:16px}.pd h1{font-size:21px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
.pd .brandline{font-size:13px;color:var(--ink2);margin-bottom:10px}
.price{font-size:26px;font-weight:700;color:var(--red);letter-spacing:-.01em}
.pergram{font-size:13px;color:var(--ink2);margin:2px 0 0}
.opt{margin-top:18px}.opt h3{font-size:14px;font-weight:600;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.o{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;font-size:14px;text-align:left;line-height:1.25}
.o small{display:block;font-size:12px;color:var(--ink2)}
.o[aria-pressed=true]{border-color:var(--sea);background:var(--sea50);color:var(--sea);font-weight:600}
.o:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{width:40px;height:40px;border:0;background:var(--paper);font-size:18px}.qty span{width:40px;display:grid;place-items:center;font-weight:600}
.facts{margin-top:18px;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.facts span{color:var(--ink2)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.bar .btn{flex:1}
.row{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--sea50)}
.row .t{font-weight:500;font-size:14px;line-height:1.3}.row .v{font-size:13px;color:var(--ink2)}
.row .l{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.sum div{display:flex;justify-content:space-between;padding:6px 0}.sum .tot{font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:600}
.field input,.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;width:100%}
.err{color:var(--red);font-size:13px;display:none}.field.bad .err{display:block}.field.bad input{border-color:var(--red)}
.pay{display:grid;gap:8px}.pay label{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.pay label:has(input:checked){border-color:var(--sea);background:var(--sea50)}
.pay small{display:block;color:var(--ink2);font-size:12px}
.empty{padding:48px 16px;text-align:center;color:var(--ink2)}
.done{padding:40px 20px;text-align:center}.done h1{font-size:22px;margin:0 0 8px}
.mock{position:fixed;right:10px;bottom:96px;z-index:9;background:var(--ink);color:#fff;border-radius:12px;font-size:12px;padding:8px 10px;opacity:.9}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}
@media (prefers-reduced-motion:no-preference){.o,.chip,.tier{transition:background .15s,border-color .15s}}
</style>
</head>

    <input name="q" placeholder="Tìm tổ yến, súp, quà tặng…" aria-label="Tìm sản phẩm"><button class="btn btn-line" style="border:0;border-radius:0">Tìm</button></form>
  <section class="hero">
    <div><h1>Tổ yến ăn liền đầu tiên tại Việt Nam</h1><p>Chưng xong trong 5 phút, làm từ tổ yến Nha Trang nguyên chất.</p>
    <a class="btn btn-white" href="#/p/to-yen-an-lien">Chọn vị</a></div>
    ${hero && hero.img ? `<img src="${esc(hero.img)}" alt="Tổ yến ăn liền">` : ''}
  </section>
  <section class="sec"><h2>Danh mục</h2><div class="chips">${CATS.map((c, i) => `<a class="chip" href="#/c/${i}">${esc(c)}</a>`).join('')}</div></section>
  <section class="sec"><h2>Quà mang về từ Nha Trang</h2><p class="sub">Chọn theo mức quà bạn muốn tặng.</p>
    <div class="tiers" role="group" aria-label="Mức giá quà">${TIERS.map(T => `<button class="tier" aria-pressed="${T.k === tierSel}" onclick="tierSel='${T.k}';render()"><b>${T.t}</b><span>${T.s}</span></button>`).join('')}</div>
    <div class="grid">${tierItems(tierSel).map(([p, v]) => card(p, v)).join('')}</div></section>
  <section class="sec"><h2>Được mua nhiều</h2><div class="grid">${best.map(p => card(p)).join('')}</div></section>
  <section class="visit"><h3>Ghé nhà yến ngay trung tâm Nha Trang</h3>
    <p>01 Nguyễn Thiện Thuật. Xem chim yến làm tổ, thử yến chưng, mua quà mang về trong ngày.</p>
    <a class="btn btn-line" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=01+Nguy%E1%BB%85n+Thi%E1%BB%87n+Thu%E1%BA%ADt+Nha+Trang">Chỉ đường</a></section>`;
}
function category(i) {
  catSel = i;
  let list = DATA;
  if (i >= 0) list = list.filter(p => p.cat === CATS[i]);
  if (searchQ) { const q = searchQ.toLowerCase(); list = list.filter(p => (p.name + ' ' + p.v.map(v => v.n).join(' ')).toLowerCase().includes(q)); }
  return hdr('#/') + `<section class="sec" style="padding-top:14px">
    <div class="chips"><button class="chip" aria-pressed="${i < 0}" onclick="searchQ='';location.hash='#/c'">Tất cả</button>${CATS.map((c, k) => `<a class="chip" aria-pressed="${k === i}" href="#/c/${k}">${esc(c)}</a>`).join('')}</div>
    <h2 style="margin-top:14px">${i >= 0 ? esc(CATS[i]) : searchQ ? 'Kết quả cho “' + esc(searchQ) + '”' : 'Tất cả sản phẩm'}</h2>
    <p class="sub">${list.length} sản phẩm</p>
    ${list.length ? `<div class="grid">${list.map(p => card(p)).join('')}</div>` : `<div class="empty">Không có sản phẩm khớp “${esc(searchQ)}”. Thử từ khác, ví dụ “súp” hoặc “quà”.</div>`}</section>`;
}
</script>
<script>
let pdQty = 1, pdSel = {};
function product(slug, vi) {
  const p = bySlug[slug]; if (!p) return hdr('#/') + '<div class="empty">Không tìm thấy sản phẩm này.</div>';
  const parts = p.v.map(v => v.n.split(' – '));
  const two = p.v.length > 1 && parts.every(x => x.length === 2);
  if (pdSel.slug !== slug) { pdQty = 1; const start = vi != null && p.v[vi] ? vi : Math.max(0, p.v.findIndex(v => v.ok)); pdSel = { slug, i: start }; }
  const cur = p.v[pdSel.i], cp = parts[pdSel.i];
  let opts = '';
  if (two) {
    const A = [...new Set(parts.map(x => x[0]))], B = [...new Set(parts.map(x => x[1]))];
    const pick = (a, b) => p.v.findIndex(v => v.n === a + ' – ' + b);
    opts = `<div class="opt"><h3>${DIM1[p.cat] || 'Loại'}</h3><div class="opts">${A.map(a => { let k = pick(a, cp[1]); if (k < 0) k = parts.findIndex(x => x[0] === a); return `<button class="o" aria-pressed="${a === cp[0]}" onclick="pdSel.i=${k};render()">${esc(a)}</button>`; }).join('')}</div></div>
      <div class="opt"><h3>Quy cách</h3><div class="opts">${B.map(b => { const k = pick(cp[0], b); const v = p.v[k]; return `<button class="o" ${k < 0 || !v.ok ? 'disabled' : ''} aria-pressed="${b === cp[1]}" onclick="pdSel.i=${k};render()">${esc(b)}<small>${k >= 0 ? vnd(v.p) : 'Không có'}</small></button>`; }).join('')}</div></div>`;
  } else if (p.v.length > 1) {
    opts = `<div class="opt"><h3>${DIM1[p.cat] || 'Quy cách'}</h3><div class="opts">${p.v.map((v, k) => { const g = grams(p, v); return `<button class="o" ${v.ok ? '' : 'disabled'} aria-pressed="${k === pdSel.i}" onclick="pdSel.i=${k};render()">${esc(v.n)}<small>${vnd(v.p)}${g ? ' · ' + vnd(Math.round(v.p / g)) + '/g' : ''}</small></button>`; }).join('')}</div></div>`;
  }
  const g = grams(p, cur);
  return hdr(catSel >= 0 ? '#/c/' + catSel : '#/') + `
  <div class="pd-img">${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}">` : ''}</div>
  <div class="pd">
    <h1>${esc(p.name)}</h1>
    <div class="brandline">${esc(p.brand || '')} · ${esc(p.cat)}</div>
    <div class="price">${vnd(cur.p)}</div>
    ${g ? `<p class="pergram">Khoảng ${vnd(Math.round(cur.p / g))} cho mỗi gram yến. So giữa các quy cách để chọn hộp lợi nhất.</p>` : ''}
    ${!cur.ok ? '<p class="pergram" style="color:var(--red)">Quy cách này đang tạm hết hàng.</p>' : ''}
    ${opts}
    <div class="opt"><h3>Số lượng</h3><div class="qty"><button aria-label="Bớt" onclick="pdQty=Math.max(1,pdQty-1);render()">−</button><span>${pdQty}</span><button aria-label="Thêm" onclick="pdQty=Math.min(99,pdQty+1);render()">+</button></div></div>
    <div class="facts">
      <div><span>Mã sản phẩm</span><b>${esc(cur.sku)}</b></div>
      <div><span>Giao hàng</span><b>Toàn quốc, phí báo khi xác nhận đơn</b></div>
      <div><span>Mua tại chỗ</span><b>01 Nguyễn Thiện Thuật, Nha Trang</b></div>
    </div>
  </div>
  <div class="bar"><button class="btn btn-line" ${cur.ok ? '' : 'disabled'} onclick="addCart('${slug}',${pdSel.i},pdQty,false)">Thêm vào giỏ</button><button class="btn btn-red" ${cur.ok ? '' : 'disabled'} onclick="addCart('${slug}',${pdSel.i},pdQty,true)">Mua ngay · ${vnd(cur.p * pdQty)}</button></div>`;
}
function addCart(slug, i, q, go) {
  const it = cart.find(x => x.s === slug && x.i === i);
  if (it) it.q = Math.min(99, it.q + q); else cart.push({ s: slug, i, q });
  saveCart();
  if (go) location.hash = '#/cart'; else { render(); toast('Đã thêm vào giỏ'); }
}
function toast(t) { const d = document.createElement('div'); d.textContent = t; d.setAttribute('role', 'status'); d.style.cssText = 'position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#16282C;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-size:14px'; document.body.appendChild(d); setTimeout(() => d.remove(), 1600); }
</script>
<script>
let codeInput = store.get('ysnt_code', REF);
const lines = () => cart.map(it => { const p = bySlug[it.s]; const v = p && p.v[it.i]; return p && v ? { it, p, v, total: v.p * it.q } : null; }).filter(Boolean);
const staffCode = c => /^NV/i.test(c || '');
function totals() {
  const sub = lines().reduce((s, l) => s + l.total, 0);
  const disc = staffCode(codeInput) ? Math.round(sub * 0.05) : 0;
  return { sub, disc, total: sub - disc };
}
function cartPage() {
  const L = lines();
  if (!L.length) return hdr('#/') + `<div class="empty"><p>Giỏ hàng đang trống.</p><a class="btn btn-red" href="#/">Xem sản phẩm</a></div>`;
  const T = totals();
  return hdr('#/') + `<section class="sec" style="padding-top:14px"><h2>Giỏ hàng</h2>
    ${L.map((l, k) => `<div class="row">${l.p.img ? `<img src="${esc(l.p.img)}" alt="">` : '<span></span>'}<div>
      <div class="t">${esc(l.p.name)}</div><div class="v">${esc(l.v.n)}</div>
      <div class="l"><div class="qty"><button aria-label="Bớt" onclick="chg(${k},-1)">−</button><span>${l.it.q}</span><button aria-label="Thêm" onclick="chg(${k},1)">+</button></div><b>${vnd(l.total)}</b></div></div></div>`).join('')}
    <div class="field" style="margin-top:16px"><label for="code">Mã giới thiệu</label>
      <input id="code" value="${esc(codeInput)}" placeholder="Nếu có, ví dụ mã của nhân viên hoặc hướng dẫn viên" oninput="codeInput=this.value.trim().toUpperCase();store.set('ysnt_code',codeInput)" onchange="render()"></div>
    <p class="sub">Mockup: mã bắt đầu bằng NV là mã nhân viên, khách được giảm 5%. Mã hướng dẫn viên không giảm giá, chỉ ghi nhận người giới thiệu.</p>
    <div class="sum"><div><span>Tạm tính</span><b>${vnd(T.sub)}</b></div>
      ${T.disc ? `<div><span>Giảm 5% theo mã nhân viên</span><b>−${vnd(T.disc)}</b></div>` : ''}
      <div><span>Phí giao hàng</span><span>Báo khi xác nhận đơn</span></div>
      <div class="tot"><span>Tổng tiền hàng</span><span>${vnd(T.total)}</span></div></div></section>
    <div class="bar"><a class="btn btn-red" href="#/checkout">Đặt hàng · ${vnd(T.total)}</a></div>`;
}
function chg(k, d) { const it = lines()[k].it; it.q += d; if (it.q <= 0) cart = cart.filter(x => x !== it); saveCart(); render(); }
function checkout() {
  if (!lines().length) { location.hash = '#/cart'; return ''; }
  const T = totals();
  return hdr('#/cart') + `<form class="sec" style="padding-top:14px" novalidate onsubmit="event.preventDefault();placeOrder(this)"><h2>Thông tin giao hàng</h2><p class="sub">Nhân viên gọi xác nhận đơn và báo phí giao hàng trước khi gửi.</p>
    <div class="field"><label for="f1">Họ tên người nhận</label><input id="f1" name="name" autocomplete="name"><span class="err">Nhập họ tên người nhận.</span></div>
    <div class="field"><label for="f2">Số điện thoại</label><input id="f2" name="phone" inputmode="tel" autocomplete="tel"><span class="err">Số điện thoại gồm 10 chữ số, bắt đầu bằng 0.</span></div>
    <div class="field"><label for="f3">Địa chỉ nhận hàng</label><input id="f3" name="addr" autocomplete="street-address"><span class="err">Nhập địa chỉ nhận hàng.</span></div>
    <div class="field"><label for="f4">Ghi chú</label><textarea id="f4" name="note" rows="2" placeholder="Ví dụ: giao giờ hành chính, gói quà"></textarea></div>
    <h2 style="margin-top:8px">Thanh toán</h2>
    <div class="pay">
      <label><input type="radio" name="pay" value="cod" checked><span>Trả tiền khi nhận hàng<small>Kiểm tra hàng rồi mới trả tiền</small></span></label>
      <label><input type="radio" name="pay" value="bank"><span>Chuyển khoản ngân hàng<small>Hiện mã QR sau khi đặt</small></span></label>
      <label><input type="radio" name="pay" value="vnpay"><span>VNPay, MoMo<small>Thẻ ATM, thẻ quốc tế, ví điện tử</small></span></label>
    </div>
    <div class="sum" style="margin-top:16px"><div><span>${lines().length} sản phẩm</span><b>${vnd(T.sub)}</b></div>${T.disc ? `<div><span>Giảm theo mã nhân viên</span><b>−${vnd(T.disc)}</b></div>` : ''}<div class="tot"><span>Tổng tiền hàng</span><span>${vnd(T.total)}</span></div></div>
    <div class="bar"><button class="btn btn-red" type="submit">Xác nhận đặt hàng</button></div></form>`;
}
</script>
<script>
function placeOrder(f) {
  const rules = { name: v => v.length >= 2, phone: v => /^0\d{9}$/.test(v.replace(/[\s.]/g, '')), addr: v => v.length >= 6 };
  let ok = true, first = null;
  for (const [k, test] of Object.entries(rules)) {
    const el = f.elements[k], good = test(el.value.trim());
    el.closest('.field').classList.toggle('bad', !good);
    el.oninput = () => el.closest('.field').classList.remove('bad');
    if (!good) { ok = false; first = first || el; }
  }
  if (!ok) { first.focus(); return; }
  const T = totals(), code = 'YS' + Date.now().toString().slice(-6);
  store.set('ysnt_last', { code, total: T.total, pay: f.elements.pay.value, name: f.elements.name.value.trim(), ref: codeInput });
  cart = []; saveCart(); location.hash = '#/done';
}
function done() {
  const o = store.get('ysnt_last', null); if (!o) { location.hash = '#/'; return ''; }
  const payText = { cod: 'Trả tiền khi nhận hàng', bank: 'Chuyển khoản ngân hàng', vnpay: 'VNPay, MoMo' }[o.pay];
  return hdr() + `<div class="done"><h1>Đã nhận đơn ${esc(o.code)}</h1>
    <p>Cảm ơn ${esc(o.name)}. Nhân viên sẽ gọi xác nhận đơn và báo phí giao hàng trong giờ làm việc.</p>
    <div class="sum" style="text-align:left;margin:18px 0"><div><span>Tổng tiền hàng</span><b>${vnd(o.total)}</b></div><div><span>Thanh toán</span><span>${payText}</span></div>${o.ref ? `<div><span>Mã giới thiệu</span><span>${esc(o.ref)}</span></div>` : ''}</div>
    <p class="sub">Đây là bản mockup, đơn này không được gửi đi.</p>
    <a class="btn btn-line" href="#/">Tiếp tục xem sản phẩm</a></div>`;
}
function render() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  let html;
  if (h[0] === 'p') html = product(h[1], h[2] != null ? +h[2] : null);
  else if (h[0] === 'c') { if (h[1] == null) catSel = -1; else searchQ = ''; html = category(h[1] != null ? +h[1] : -1); }
  else if (h[0] === 'cart') html = cartPage();
  else if (h[0] === 'checkout') html = checkout();
  else if (h[0] === 'done') html = done();
  else html = home();
  if (html) $('#app').innerHTML = html;
}
let lastHash = location.hash;
addEventListener('hashchange', () => { if (!location.hash.startsWith('#/p/' + (pdSel.slug || '~'))) pdSel = {}; render(); if (location.hash !== lastHash) scrollTo(0, 0); lastHash = location.hash; });
render();
</script>
</body>
